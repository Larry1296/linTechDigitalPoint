name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: lintech, POSTGRES_PASSWORD: lintech, POSTGRES_DB: lintech_digital_point}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lintech" --health-interval 5s --health-timeout 5s --health-retries 10
    env: {POSTGRES_HOST: localhost, POSTGRES_USER: lintech, POSTGRES_PASSWORD: lintech, POSTGRES_DB: lintech_digital_point, DJANGO_SECRET_KEY: ci-only}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements.txt
      - run: ruff check .
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend


name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: lintech, POSTGRES_PASSWORD: lintech, POSTGRES_DB: lintech_digital_point}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lintech" --health-interval 5s --health-timeout 5s --health-retries 10
    env: {DB_HOST: localhost, DB_PORT: 5432, DB_USER: lintech, DB_PASSWORD: lintech, DB_NAME: lintech_digital_point, SECRET_KEY: ci-only}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r server/requirements.txt
      - run: ruff check .
        working-directory: server
      - run: python manage.py check
        working-directory: server
      - run: python manage.py makemigrations --check --dry-run
        working-directory: server
      - run: pytest
        working-directory: server
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: client/package-lock.json}
      - run: npm ci
        working-directory: client
      - run: npm run lint && npm test && npm run build
        working-directory: client
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # a stuck browser test fails the run instead of holding the deploy for GitHub's 6 hours
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: lintech, POSTGRES_PASSWORD: lintech, POSTGRES_DB: lintech_digital_point}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lintech" --health-interval 5s --health-timeout 5s --health-retries 10
    env: {DB_HOST: localhost, DB_PORT: 5432, DB_USER: lintech, DB_PASSWORD: lintech, DB_NAME: lintech_digital_point, SECRET_KEY: ci-only}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: client/package-lock.json}
      - run: pip install -r server/requirements.txt
      # Like production: a fresh database only needs its migrations (seed_initial is for the original single-business
      # setup and stops on an empty database, so the server never started).
      - run: python manage.py migrate && python manage.py runserver 127.0.0.1:8000 &
        working-directory: server
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run dev -- --host 127.0.0.1 &
        working-directory: client
      # The API only has to be listening: /auth/me/ answers "not signed in" to an anonymous check, which wait-on never accepts.
      - run: npx wait-on --timeout 180000 http://127.0.0.1:5173 tcp:127.0.0.1:8000 && npm run test:e2e
        working-directory: client
        env: {E2E_BASE_URL: "http://127.0.0.1:5173"}

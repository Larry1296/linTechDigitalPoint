# Production on one server (a DigitalOcean Droplet): the database, the app, the web front and daily backups.
# Lives in /opt/lintech on the server next to its .env; the deploy workflow copies it there and sets IMAGE_TAG.
#   docker compose up -d            start or update
#   docker compose logs -f app      follow the app's log
#   docker compose exec app python manage.py createsuperuser
name: lintech

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256m

  app:
    image: ${IMAGE_PREFIX}-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      BEHIND_HTTPS_PROXY: "True"
      DB_CONN_MAX_AGE: "60"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Jobs the app runs by itself (docker compose logs scheduler to see them). Every hour: hotel guests' nights that are
  # due. Every 6 hours: money market fund rates (e.g. CIC's), which it looks up only when due, every 10 days.
  scheduler:
    image: ${IMAGE_PREFIX}-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      TZ: Africa/Nairobi
    healthcheck:
      disable: true  # the image's check is for the web server, which this container does not run
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 120
        hour=0
        while true; do
          python manage.py charge_room_nights || echo "Room nights: the run failed; trying again in an hour"
          if [ $$((hour % 6)) -eq 0 ]; then
            python manage.py refresh_fund_rates || echo "Fund rates: the check failed; trying again later"
          fi
          hour=$$((hour + 1))
          sleep 3600
        done
    depends_on:
      - app

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # A compressed copy of the database every night at about 02:00 (Nairobi), the last 14 kept in the backups volume
  # (docker compose run --rm backup ls -lh /backups to see them). Copy them off the server too: see docs/deployment.md.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      TZ: Africa/Nairobi
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%H%M)
          if [ "$$now" = "0200" ]; then
            file=/backups/lintech-$$(date +%Y%m%d-%H%M).dump
            pg_dump -Fc -f "$$file.part" && mv "$$file.part" "$$file" && echo "Backup saved: $$file"
            ls -1t /backups/*.dump 2>/dev/null | tail -n +15 | xargs -r rm --
            sleep 60
          fi
          sleep 30
        done

volumes:
  db:
  media:
  backups:
  caddy_data:
  caddy_config:
